# Deploys the site to GitHub Pages on every push to main.
# First run: the configure-pages step tries to switch the repository to "GitHub Actions" as the Pages source.
# If that step is refused, do it once by hand: Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# This file is meant for the repository that holds the site at its root (pcduks.github.io). While the site
# still lives in portfolio/ of japan-family-trip, GitHub ignores it there (workflows only run from the root .github/).
# For a *project* site (https://<user>.github.io/<repo>/) set the VITE_BASE repository variable to "/<repo>/".
# For a user site (https://<user>.github.io/) or a custom domain, leave it unset.

name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE }}
          # The default token can read your public repos; add a fine-grained PAT as a secret to list private ones too.
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN || github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
