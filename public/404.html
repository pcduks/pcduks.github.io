    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: radial-gradient(120% 90% at 70% 30%, #141f45 0%, #0b1020 55%, #070a16 100%); color: #f3ead9; font-family: 'IBM Plex Mono', ui-monospace, monospace; text-align: center; padding: 24px; }
      .board { display: inline-block; padding: 18px 22px; border-radius: 12px; background: #060913; border: 1px solid rgba(243,234,217,0.12); box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
      .label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: #f5b453; margin: 0 0 10px; }
      h1 { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: clamp(40px, 8vw, 72px); line-height: 1; margin: 0 0 12px; }
      h1 em { color: #f5b453; }
      p { color: #c9c3b4; font-size: 14px; max-width: 42ch; margin: 0 auto 18px; line-height: 1.6; }
      a { display: inline-block; padding: 10px 18px; border-radius: 999px; background: #f5b453; color: #1a1206; text-decoration: none; font-weight: 500; font-size: 14px; }
    </style>
  </head>
  <body>
    <main class="board">
      <p class="label">Gate change</p>
      <h1>Flight <em>404</em></h1>
